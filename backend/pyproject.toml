[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qawaid-backend"
version = "0.1.0"
description = "Qawaid backend API — question engine, prompt analysis, optional CAMeL Tools"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "supabase>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
camel = [
    "camel-tools>=1.5.0",
]
